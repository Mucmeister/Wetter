name: Datenquellen-Test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out && cd out
          NOW=$(date -u +%s)
          T=$(date -u -d @$(( (NOW-1800)/600*600 )) +%Y-%m-%dT%H:%M:00Z)
          for tm in "$T" "$(date -u -d @$(( (NOW-600)/600*600 )) +%Y-%m-%dT%H:%M:00Z)"; do
          curl -s -m 60 -o sat_$(echo $tm|tr -d ':').jpg -w "sat $tm %{http_code} %{size_download} %{content_type} %{time_total}s\n" "https://view.eumetsat.int/geoserver/wms?service=WMS&request=GetMap&layers=mtg_fd:rgb_geocolour&styles=&format=image/jpeg&transparent=false&version=1.3.0&time=$tm&width=256&height=256&crs=EPSG:3857&bbox=1113194.9,6261721.4,1252344.3,6400870.8" >> r.txt; done
          P=$(date -u -d @$(( (NOW-3600)/300*300 )) +%Y-%m-%dT%H:%M)
          curl -s -m 60 "https://api.brightsky.dev/radar?format=compressed&date=${P}Z&last_date=${P}Z" | python3 -c "import json,sys;d=json.load(sys.stdin);print('past', [(r['timestamp'],r['source']) for r in d['radar']])" >> r.txt
          F=$(date -u -d @$(( (NOW+3600)/300*300 )) +%Y-%m-%dT%H:%M)
          curl -s -m 60 "https://api.brightsky.dev/radar?format=compressed&date=${F}Z&last_date=${F}Z" | python3 -c "import json,sys;d=json.load(sys.stdin);print('future', [(r['timestamp'],r['source']) for r in d['radar']])" >> r.txt
          F=$(date -u -d @$(( (NOW+7500)/300*300 )) +%Y-%m-%dT%H:%M)
          curl -s -m 60 "https://api.brightsky.dev/radar?format=compressed&date=${F}Z&last_date=${F}Z" | python3 -c "import json,sys;d=json.load(sys.stdin);print('beyond', [(r['timestamp'],r['source']) for r in d['radar']])" >> r.txt
          curl -s -m 30 -D - -o /dev/null "https://api.brightsky.dev/radar?format=compressed&date=${P}Z&last_date=${P}Z" -H 'Origin: https://mucmeister.github.io' | grep -i "access-control\|cache-control\|HTTP" >> r.txt
          curl -s -m 30 -D - -o /dev/null "https://raw.githubusercontent.com/Mucmeister/Wetter/radar/hg.json?t=1" -H 'Origin: https://mucmeister.github.io' | grep -i "access-control\|cache-control\|HTTP" >> r.txt
          git init -q -b probe && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
