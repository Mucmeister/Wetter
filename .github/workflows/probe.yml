name: Datenquellen-Test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out && cd out
          NOW=$(date -u +%s); f(){ date -u -d @$(( ($NOW + $1*60)/300*300 )) +%Y-%m-%dT%H:%M; }
          for r in "-120 0" "0 120" "-180 -150" "-5 -5" "60 60"; do set -- $r
            curl -s -m 60 -o bs.json -w "bs $(f $1)..$(f $2) %{http_code} %{size_download} %{time_total}s " "https://api.brightsky.dev/radar?format=compressed&date=$(f $1)Z&last_date=$(f $2)Z&tz=Etc/UTC"
            python3 -c "import json;d=json.load(open('bs.json'));r=d.get('radar',[]);print(len(r), r[0]['timestamp'] if r else '', r[-1]['timestamp'] if r else '', [k for k in r[0]] if r else d)" ; done >> bs.txt 2>&1
          curl -s -m 60 -o bsb.json "https://api.brightsky.dev/radar?format=plain&date=$(f -5)Z&last_date=$(f -5)Z&bbox=100,100,300,300"
          python3 -c "import json;d=json.load(open('bsb.json'));r=d['radar'];p=r[0]['precipitation_5'];print('bbox plain', len(p), len(p[0]), d.get('bbox'), d.get('geometry'))" >> bs.txt 2>&1
          python3 -c "
          import json,base64,zlib,array
          d=json.load(open('bs.json'));r=d['radar'][0];raw=zlib.decompress(base64.b64decode(r['precipitation_5']))
          print('compressed frame bytes', len(r['precipitation_5']), 'raw', len(raw), 'items', len(raw)//2, 'max', max(array.array('H',raw)))" >> bs.txt 2>&1
          W='https://maps.dwd.de/geoserver/dwd/wms'; BB='5.5,47,15.5,55.2'
          for k in 1 2 3; do T=$(date -u -d @$(( (NOW - k*900)/300*300 )) +%Y-%m-%dT%H:%M:00.000Z)
            curl -s -m 90 -o /dev/null -w "wms Radar $T %{http_code} %{size_download} %{time_total}s\n" "$W?service=WMS&version=1.1.1&request=GetMap&layers=dwd:Radar_rv_product_1x1km_ger&styles=&format=image/png&transparent=true&srs=EPSG:3857&bbox=600000,5900000,1700000,7400000&width=512&height=512&time=$T" ; done >> wms.txt
          curl -s -m 90 "https://view.eumetsat.int/geoserver/wms?service=WMS&version=1.3.0&request=GetCapabilities" -o ev.xml
          curl -sI -m 60 "https://view.eumetsat.int/geoserver/wms?service=WMS&version=1.3.0&request=GetCapabilities" -H 'Origin: https://mucmeister.github.io' > cors_ev.txt
          python3 - <<'PY'
          import re
          s=open('ev.xml').read(); out=open('ev_layers.txt','w')
          for m in re.finditer(r'<Layer[^>]*>\s*<Name>([^<]+)</Name>\s*<Title>([^<]*)</Title>(.*?)</Layer>', s, re.S):
              n,t,b=m.groups(); d=re.findall(r'<Dimension[^>]*name="time"[^>]*default="([^"]*)"[^>]*>([^<]{0,120})', b)
              out.write(f"{n} | {t} | {d}\n")
          PY
          curl -s -m 60 -o hy "https://opendata.dwd.de/weather/radar/composite/hymecng/composite_HymecNG_LATEST_000-hd5"
          pip -q install h5py numpy >/dev/null 2>&1
          python3 -c "
          import h5py,numpy as np
          h=h5py.File('hy');l=h['dataset1/data1/legend'][:];print(l)
          d=h['dataset1/data1/data'][:];v,c=np.unique(d,return_counts=True);print(dict(zip(v.tolist(),c.tolist())))
          print(dict(h['dataset1/data1/what'].attrs))" > hymec2.txt 2>&1
      - run: |
          cd out && rm -f bs_full.json cap.xml && git init -q -b probe && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
