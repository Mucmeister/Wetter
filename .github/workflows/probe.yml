name: Datenquellen-Test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out && cd out
          curl -s -m 60 "https://api.open-meteo.com/v1/forecast?latitude=48.14&longitude=11.58&timezone=Europe/Berlin&hourly=sunshine_duration,cloud_cover&models=ecmwf_ifs,ecmwf_aifs025_single,dwd_icon_seamless,meteofrance_seamless,ukmo_seamless,ncep_gfs_seamless,ncep_aigfs025,google_weathernext2_ensemble&forecast_days=10" -o f.json
          python3 - > r.txt <<'PY'
          import json
          d=json.load(open('f.json')); h=d.get('hourly',d); t=h.get('time',[])
          print(d.get('reason',''))
          for k,v in h.items():
              if not k.startswith('sunshine'): continue
              days={}
              for tt,x in zip(t,v):
                  hr=int(tt[11:13])
                  if 9<=hr<=20: days.setdefault(tt[:10],[]).append(x)
              print(k, [ (round(sum(a)/3600,1) if None not in a else None) for a in days.values()])
          PY
          git init -q -b probe && git add r.txt
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
