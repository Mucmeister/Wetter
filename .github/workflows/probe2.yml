name: Testabfrage
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e; mkdir -p out; pip -q install numpy >/dev/null 2>&1
          bash tools/probe-run.sh; ls out
          cd out && git init -q -b probe2 && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe2
