<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wetter">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1a28">
<meta name="format-detection" content="telephone=no">
<title>Wetter – Modell-Konsens</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org https://maps.dwd.de; connect-src 'self' https://raw.githubusercontent.com https://api.open-meteo.com https://ensemble-api.open-meteo.com https://previous-runs-api.open-meteo.com https://geocoding-api.open-meteo.com https://api.brightsky.dev https://api.bigdatacloud.net https://air-quality-api.open-meteo.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
:root{
  --fg:#fff; --fg2:rgba(255,255,255,.72); --fg3:rgba(255,255,255,.5);
  --card:rgba(255,255,255,.13); --line:rgba(255,255,255,.18);
  --bg1:#2f6aa8; --bg2:#5d9bd6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#2f6aa8;-webkit-text-size-adjust:100%}
html,body{min-height:100%}
/* App-Gefühl: kein Tipp-Blitzen, keine Textauswahl, kein Doppeltipp-Zoom */
body{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  color:var(--fg); background:var(--bg2);
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,var(--bg1),var(--bg2))}
body.night{--bg1:#0b1530;--bg2:#24345e}
body.overcast{--bg1:#4f5f73;--bg2:#8796a8}
body.night.overcast{--bg1:#1c2330;--bg2:#3a4556}
body.rain{--bg1:#3c4b5e;--bg2:#6c7d91}
body.night.rain{--bg1:#151c28;--bg2:#2e3a4c}
body.snow{--bg1:#6f8299;--bg2:#b4c3d4}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;height:40px}
.iconbtn{background:var(--card);border:0;color:var(--fg);width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.iconbtn svg{width:18px;height:18px}
.hero{text-align:center;padding:18px 0 26px}
.hero .place{font-size:32px;font-weight:400;letter-spacing:.2px}
.hero .temp{font-size:96px;font-weight:200;line-height:1;margin:2px 0 4px 18px}
.hero .cond{font-size:20px;font-weight:500;color:var(--fg)}
.hero .hl{font-size:20px;font-weight:500;margin-top:2px}
.hero .hl .sun{color:var(--fg2);font-weight:400;font-size:17px;margin-left:12px;white-space:nowrap}
.sunsym{width:15px;height:15px;color:#ffd23f;vertical-align:-2px;margin-right:4px;display:inline-block}
.hero .sub{font-size:13px;color:var(--fg2);margin-top:6px}
.card{background:var(--card);border-radius:16px;margin-bottom:12px;overflow:hidden;
  -webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%)}
.card h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--fg2);
  padding:12px 16px 8px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.card h3 svg{width:14px;height:14px;opacity:.8}
.note{font-size:14px;line-height:1.4;padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.hours{display:flex;overflow-x:auto;padding:10px 6px 12px;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.hr{flex:0 0 54px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.hr .t{font-size:14px;font-weight:600}
.hr .h{font-size:14px;font-weight:500}
.hr .p{font-size:11px;font-weight:600;color:#9fd3ff;height:13px}
.hr svg{width:30px;height:30px}
.nowi{display:block;height:30px}
.hr.win .h{color:#fff}
.hr.out{opacity:.62}
.days .row{display:grid;column-gap:4px;grid-template-columns:78px 34px 46px 36px 1fr 36px;align-items:center;
  padding:10px 16px;border-top:1px solid var(--line);gap:6px;cursor:pointer;font-size:18px;font-weight:500}
.days .row:first-child{border-top:0}
.days .d{font-weight:600}
.days svg{width:30px;height:30px}
.days .pp{font-size:12px;font-weight:700;color:#9fd3ff;text-align:left}
.days .mn{color:var(--fg3);text-align:right}
.days .mx{text-align:right}
.bar{position:relative;height:5px;border-radius:3px;background:rgba(0,0,0,.18)}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.bar b{position:absolute;top:-2px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.25)}
.nightrain{font-size:11px;font-weight:600;color:#9fd3ff;white-space:nowrap}
.nightrain.unsure{color:#ffd27a}
.sure{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.sure.good{background:rgba(120,220,140,.25)} .sure.mid{background:rgba(255,210,90,.25)} .sure.bad{background:rgba(255,120,100,.28)}
.track{padding:6px 16px 4px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.trow .tb{height:8px;border-radius:4px;background:rgba(0,0,0,.18);position:relative}
.trow .tb i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#9fd3ff}
.trow.us{font-weight:700} .trow.us .tb i{background:#7ee0a0}
.trow .r{text-align:right}
.dsec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--fg3);margin:14px 0 4px}
.dline{font-size:14px;color:var(--fg);line-height:1.45}
.dline span{color:var(--fg2)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:3px 8px;font-size:14px;line-height:1.4;margin-top:4px}
.kv > div:nth-child(odd){color:var(--fg3)}
.kv span{color:var(--fg2)}
.detail .hours{padding:6px 0 4px;margin:0 -6px}
.detail .hr{flex:0 0 46px}
.detail .hr svg{width:26px;height:26px}
.detail .hr.out{opacity:.5}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 24px 44px 24px 44px 58px;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px;color:var(--fg)}
.mrow.head{border-top:0;font-size:10px;font-weight:600;color:var(--fg3);text-transform:uppercase;padding:2px 0;align-items:end;line-height:1.15}
.mrow .n{line-height:1.2}
.mrow .r{text-align:right}
.mrow .bar{height:4px}
.mrow.cons,.hrow.cons{font-weight:700;color:#e7c27e;border-top:0}
.mrow.cons + .mrow{border-top:1.5px solid rgba(243,238,228,.35)}
.hrow.cons + .hrow{border-top:1.5px solid rgba(243,238,228,.35)}
.tag.best{background:rgba(126,214,160,.22);color:#9fe6b8;font-weight:600}
.track .hrow{grid-template-columns:minmax(0,1fr) 54px 58px 52px;font-size:14px}
.track .hrow .us{font-weight:700;color:var(--fg)}
.track .hrow .plus{color:#9fe6b8;font-weight:600}
.track .hrow .sub{display:block;font-size:11px;color:var(--fg3)}
.track .hrow.head{font-size:11px}
.infl{display:flex;align-items:center;gap:5px;justify-content:flex-start}
.infl span{width:30px;flex:none;text-align:right;white-space:nowrap}
.infl i{display:block;height:6px;border-radius:3px;background:#9fd3ff}
.hint{font-size:12px;color:var(--fg2);line-height:1.4;margin:2px 0 6px}
.detail{display:none;padding:4px 16px 14px;font-size:13px;color:var(--fg2);background:rgba(0,0,0,.08)}
.detail.open{display:block}
.detail table{width:100%;border-collapse:collapse;margin-top:6px}
.detail td,.detail th{padding:5px 2px;text-align:right;font-weight:500}
.detail th{font-weight:600;color:var(--fg3);font-size:11px;text-transform:uppercase}
.detail td:first-child,.detail th:first-child{text-align:left}
.detail .w{display:inline-block;height:6px;border-radius:3px;background:#9fd3ff;vertical-align:middle;margin-right:4px}
.agree{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;margin-top:8px}
.agree.good{background:rgba(120,220,140,.25)} .agree.mid{background:rgba(255,210,90,.25)} .agree.bad{background:rgba(255,120,100,.28)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid .card{margin:0}
.tile{padding:0 16px 14px}
.tile .v{font-size:30px;font-weight:400;margin-top:8px}
.tile .s{font-size:13px;color:var(--fg2);margin-top:6px;line-height:1.35}
#map{height:300px;background:#1b2a3a}
.mapwrap{position:relative}
.mapwrap .expand{position:absolute;right:10px;top:10px;z-index:500;width:34px;height:34px;border-radius:50%;border:0;
  background:rgba(20,30,45,.65);color:#fff;display:grid;place-items:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mapwrap .expand svg{width:16px;height:16px}
.mapcard.full{position:fixed;inset:0;z-index:2000;margin:0;border-radius:0;display:flex;flex-direction:column;
  background:#132033;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.mapcard.full h3{display:none}
.mapcard.full .mapwrap{flex:1}
.mapcard.full #map{height:100%}
.mapcard.full .expand{top:12px}
body.mapopen{overflow:hidden}
/* Ziehen zum Aktualisieren */
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 6px);z-index:1500;width:34px;height:34px;margin-left:-17px;border-radius:50%;
  background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:grid;place-items:center;
  opacity:0;transform:translateY(-50px);pointer-events:none}
#ptr svg{width:18px;height:18px}
#ptr.spin svg{animation:s .8s linear infinite}
.updated{font-size:12px;color:var(--fg3);margin-top:4px}
.mapbar{display:flex;gap:8px;padding:10px 16px 12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--fg2)}
.chip{background:rgba(255,255,255,.16);border:0;color:#fff;padding:6px 11px;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:#fff;color:#1d3b5e}
.models table{width:100%;border-collapse:collapse;font-size:13px}
.models td,.models th{white-space:nowrap;padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.models th{color:var(--fg3);font-size:11px;font-weight:600;text-transform:uppercase;border-top:0}
.models td:first-child,.models th:first-child{text-align:left;padding-left:16px}
.models td:last-child,.models th:last-child{padding-right:16px}
.tag{font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.2);margin-left:4px;vertical-align:1px}
.tag.ki{background:rgba(190,140,255,.4)}
.muted{color:var(--fg3)}
.explain{font-size:13px;line-height:1.45;color:var(--fg2);padding:10px 16px 14px}
.explain p+p{margin-top:8px}
.foot{font-size:11px;color:var(--fg3);text-align:center;line-height:1.6;margin-top:18px}
.foot a{color:var(--fg2)}
/* Suche */
.sheet{position:fixed;inset:0;background:rgba(10,16,28,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  display:none;z-index:1000;padding:calc(env(safe-area-inset-top) + 14px) 16px 16px}
.sheet.open{display:block}
.sheet .box{max-width:560px;margin:0 auto}
.search{display:flex;gap:8px}
.search input{flex:1;font-size:17px;padding:10px 14px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:#fff;outline:none}
.search input::placeholder{color:rgba(255,255,255,.55)}
.search button{background:none;border:0;color:#9fd3ff;font-size:17px;cursor:pointer}
.results{margin-top:12px}
.results div{padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.1);margin-bottom:8px;font-size:16px;cursor:pointer}
.results small{display:block;color:var(--fg2);font-size:13px;margin-top:2px}
.loading{text-align:center;padding:120px 20px;color:var(--fg2);font-size:15px}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.err{background:rgba(255,90,80,.25);padding:12px 16px;border-radius:12px;font-size:14px;margin-bottom:12px}
.leaflet-container{font-family:inherit}
/* ===== Gestaltung „Tinte & Messing“: ruhiger Hintergrund, Messing-Akzent, größere Schrift ===== */
/* Einheitlich Systemschrift (iPhone: SF Pro) – auch Ort und große Zahlen */
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Inter",sans-serif;font-feature-settings:"tnum" 1}

:root,body,body.night,body.overcast,body.rain,body.snow,body.night.rain,body.night.overcast{--bg1:#0d1a28;--bg2:#163044}
body{--fg:#f3eee4;--fg2:rgba(243,238,228,.72);--fg3:rgba(243,238,228,.5);--card:rgba(255,255,255,.055);--line:rgba(243,238,228,.10)}
.card{border:1px solid rgba(243,238,228,.08);-webkit-backdrop-filter:none;backdrop-filter:none}
.card h3{color:#d9b26f}
.hero .temp{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Inter",sans-serif;font-weight:200;letter-spacing:-1px;margin-left:14px}
.hero .place{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Inter",sans-serif;font-weight:500}
.tile .v{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Inter",sans-serif;font-weight:400}
.nightrain,.infl i{color:#e7c27e}
.hr .p,.days .pp,.legend{color:#7cc4ff}
.hr .p,.days .pp{white-space:nowrap}
.days .row.past{opacity:.78}
.days .row.past .d{font-weight:500}
.days .ist{font-size:9.5px;line-height:1.1;color:var(--fg3);text-align:center;text-transform:uppercase;letter-spacing:.3px}
.histnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 6px}
.histnav b{font-size:15px;font-weight:600}
.histnav button{background:rgba(243,238,228,.08);border:0;color:var(--fg);width:40px;height:34px;border-radius:10px;font-size:22px;line-height:1;cursor:pointer}
.histnav span{width:40px}
.days svg.histchart{width:100%;height:auto;display:block;margin:4px 0 2px}
.histchart text{font-size:9px;fill:rgba(243,238,228,.5)}
.histchart text.ph{font-size:9px;font-weight:600;fill:rgba(124,196,255,.85);letter-spacing:.2px}
.histchart text.pl{font-size:9px;fill:rgba(124,196,255,.85)}
.histchart text.wl{font-size:8.5px;fill:rgba(243,238,228,.55)}
.rank{display:inline-block;width:16px;height:16px;border-radius:50%;font-style:normal;font-size:10px;font-weight:700;line-height:16px;text-align:center;margin-right:6px;vertical-align:1px;color:#1b2330}
.rank.r1{background:#e8c25a}.rank.r2{background:#c9d1da}.rank.r3{background:#d39a6a}
.hint .rank{margin-right:2px}
.sunv{display:flex;flex-direction:column;gap:2px;font-size:20px!important;margin-top:8px!important}
.sunv span{display:flex;align-items:center;gap:6px}
.srs{width:22px;height:22px;color:var(--fg2);flex:none}
.rain2h .pk{display:inline-block;width:10px;height:8px;border-radius:2px;margin:0 3px 0 6px;vertical-align:0}
.rain2h .pk:first-child{margin-left:0}
.histleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--fg2);margin-bottom:8px}
.histleg i{display:inline-block;width:16px;height:0;border-top:2.4px solid #f3eee4;vertical-align:3px;margin-right:5px}
.histleg i.f{border-top:2px dashed #d9b26f}
.histleg i.r{width:8px;height:8px;border:0;background:#7cc4ff;opacity:.55;border-radius:2px;vertical-align:0}
.hrow{display:grid;grid-template-columns:1fr 44px 44px 64px;gap:4px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.hrow > div:not(.n){text-align:right;font-variant-numeric:tabular-nums}
.hrow.head{font-size:11px;color:var(--fg3);border-top:0}
.hrow .n{text-align:left;display:flex;align-items:center}
.hrow.obs{font-weight:700;color:var(--fg)}
.days .pp .amt{display:block;font-size:10.5px;font-weight:500;color:var(--fg3);margin-top:1px;padding-left:9px}
svg.drop,.hr svg.drop,.days svg.drop,.legend svg.drop{width:7px;height:10px;margin:0 2px 0 0;vertical-align:-1px;display:inline-block}
.legend{font-size:12px;padding:8px 16px 4px}.infl i{background:#d9b26f}
.iconbtn{background:rgba(243,238,228,.08)}
html{background:#0d1a28}
.basemap{filter:invert(1) hue-rotate(185deg) brightness(.78) contrast(.9) saturate(.35)}
/* Regenbalken (Radar) */
.rain2h{padding:8px 16px 4px;border-bottom:1px solid var(--line)}
.rain2h svg{width:100%;height:auto;display:block}
.rain2h svg text{font-size:9px;fill:rgba(243,238,228,.5)}
.plegend{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--fg2);flex-wrap:wrap}
.plegend i{display:inline-block;width:16px;height:7px;border-radius:2px;margin-left:6px}
.plegend i:first-child{margin-left:0}
.tsec{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px;margin:4px 4px 8px}
.alerts{padding:6px 16px}
.al{display:flex;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.al:first-child{border-top:0}
.al svg{width:22px;height:22px;flex:none}
.al b{display:block;font-size:14px;font-weight:600}
.al span{display:block;font-size:12px;color:var(--fg2);margin-top:1px}
.warr{width:22px;height:22px;margin-left:8px;vertical-align:-2px;color:var(--fg2)}
.rain2h .rlab{font-size:11px;color:var(--fg3);margin-bottom:2px}
.rain2h .ax{display:flex;justify-content:space-between;font-size:11px;color:var(--fg3);margin-top:2px}
/* Warnungen */
.warn{border-radius:14px;padding:11px 14px;margin-bottom:12px;font-size:14px;line-height:1.35;cursor:pointer;border:1px solid transparent}
.warn b{display:block;font-size:15px}
.warn small{color:var(--fg2)}
.warn .more{display:none;margin-top:6px;color:var(--fg2);font-size:13px;white-space:pre-line}
.warn.open .more{display:block}
.warn.minor{background:rgba(242,201,76,.16);border-color:rgba(242,201,76,.35)}
.warn.moderate{background:rgba(242,140,40,.18);border-color:rgba(242,140,40,.45)}
.warn.severe{background:rgba(230,70,60,.2);border-color:rgba(230,70,60,.5)}
.warn.extreme{background:rgba(170,60,200,.24);border-color:rgba(170,60,200,.55)}
.warn.hint{background:rgba(243,238,228,.06);border-color:rgba(243,238,228,.14)}
/* Favoriten */
.place-row{display:flex;align-items:center;justify-content:center;gap:8px}
.star{background:none;border:0;color:var(--fg3);font-size:22px;line-height:1;cursor:pointer;padding:4px}
.star.on{color:#d9b26f}
.dots{display:flex;gap:6px;justify-content:center;margin-top:6px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(243,238,228,.25)}
.dots i.on{background:#f3eee4}
.measured{font-size:12px;color:var(--fg3);margin-top:-2px;margin-bottom:4px}
.results .fav-h{background:none;padding:6px 2px 4px;font-size:12px;color:var(--fg3);text-transform:uppercase;letter-spacing:.4px;cursor:default}
.results .rm{float:right;color:var(--fg3);font-size:18px;line-height:1;padding:0 4px}
/* „Wie diese Vorhersage entsteht“ eingeklappt */
.models .fold{cursor:pointer;border-bottom:0}
.models .chev{margin-left:auto;font-size:18px;line-height:1;transition:transform .2s;color:var(--fg3)}
.models.open .chev{transform:rotate(90deg)}
.models .teaser{font-size:13px;color:var(--fg2);padding:0 16px 12px;line-height:1.4;cursor:pointer}
.models .foldbody{display:none;border-top:1px solid var(--line)}
.models.open .foldbody{display:block}
.models.open .teaser{display:none}
.track .tl{font-size:12px;color:var(--fg3);margin:8px 0 0}
.track .tl:first-child{margin-top:0}
.trow .tb i{background:rgba(243,238,228,.38)} .trow.us .tb i{background:#7ed6a0}
</style>
</head>
<body>
<div id="ptr"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg></div>
<div class="wrap">
  <div class="top">
    <button class="iconbtn" id="btnLoc" aria-label="Aktueller Standort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 20l8-4 8 4z" transform="rotate(45 12 12)"/></svg></button>
    <button class="iconbtn" id="btnSearch" aria-label="Ort suchen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
  </div>
  <div id="app"><div class="loading"><div class="spin"></div>Lade Modelle …</div></div>
</div>

<div class="sheet" id="sheet">
  <div class="box">
    <div class="search"><input id="q" placeholder="Stadt oder Ort suchen" autocomplete="off"><button id="close">Abbrechen</button></div>
    <div class="results" id="results"></div>
  </div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
